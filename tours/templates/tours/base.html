{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Horse Tours{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'tours/style.css' %}">
</head>
<body>
  <nav class="nav">
    <a href="{% url 'tour_list' %}" class="nav-brand">🐎 Horse Tours</a>
    <div class="nav-links">
      {% if user.is_authenticated %}
        <a href="{% url 'my_bookings' %}">Мои туры</a>
        <span class="muted">{{ user.username }}</span>
        <form method="post" action="{% url 'logout' %}">
          {% csrf_token %}
          <button type="submit" class="link">Выйти</button>
        </form>
      {% else %}
        <a href="{% url 'login' %}">Войти</a>
        <a href="{% url 'register' %}">Регистрация</a>
      {% endif %}
    </div>
  </nav>

  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
